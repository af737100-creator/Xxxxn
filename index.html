<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dump & Find - مستودع رمزي</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { color: #10b981; margin-bottom: 5px; }
        textarea { width: 100%; height: 100px; border-radius: 12px; padding: 12px; background: #0f172a; color: white; border: 1px solid #334155; margin-bottom: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-text { background-color: #10b981; color: white; }
        .btn-image { background-color: #3b82f6; color: white; }
        input[type="file"] { margin: 15px 0; color: #94a3b8; width: 100%; }
        #status { margin-top: 15px; font-size: 0.9em; padding: 10px; border-radius: 8px; }
        .success { color: #10b981; background: rgba(16, 185, 129, 0.1); }
    </style>
</head>
<body>

    <h1>Dump & Find</h1>
    <p>ارمي ملاحظاتك وصورك هنا..</p>

    <div class="card">
        <textarea id="textContent" placeholder="اكتب ملاحظة سريعة..."></textarea>
        <button onclick="sendText()" class="btn btn-text">حفظ النص</button>

        <hr style="border: 0.5px solid #334155; margin: 20px 0;">

        <input type="file" id="imageInput" accept="image/*">
        <button onclick="uploadImage()" class="btn btn-blue">رفع صورة للمستودع</button>

        <div id="status"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://af737100-creator.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_vPxzDCtgCkG8VDy-4vkVsg_rYLQZ3yM'; // مفتاحك الذي أرسلته
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function sendText() {
            const content = document.getElementById('textContent').value;
            if (!content) return;
            const { error } = await supabase.from('random_dumps').insert([{ content }]);
            if (!error) {
                document.getElementById('status').innerText = "تم حفظ النص!";
                document.getElementById('textContent').value = "";
            }
        }

        async function uploadImage() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) return alert("اختر صورة أولاً");

            document.getElementById('status').innerText = "جاري رفع الصورة...";
            const fileName = `${Date.now()}_${file.name}`;

            const { data, error } = await supabase.storage
                .from('RANDOM_MEDIA') // اسم الباكت الذي أنشأته في الصورة (17:56)
                .upload(fileName, file);

            if (error) {
                document.getElementById('status').innerText = "فشل: " + error.message;
            } else {
                document.getElementById('status').innerText = "تم رفع الصورة بنجاح!";
                document.getElementById('imageInput').value = "";
            }
        }
    </script>
</body>
</html>
