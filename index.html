<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستودع رمزي V2</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; text-align: center; padding: 20px; }
        .card { background: #1e293b; padding: 25px; border-radius: 20px; max-width: 450px; margin: auto; border: 2px solid #334155; }
        textarea { width: 100%; height: 100px; border-radius: 12px; padding: 12px; background: #0f172a; color: white; border: 1px solid #334155; margin-bottom: 15px; box-sizing: border-box; }
        .btn { width: 100%; padding: 14px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
        .btn-green { background-color: #10b981; color: white; }
        .btn-blue { background-color: #3b82f6; color: white; }
        input[type="file"] { margin: 20px 0; color: #94a3b8; display: block; width: 100%; }
        #status { margin-top: 15px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>تحديث: مستودع الصور والنصوص</h2>
    <div class="card">
        <textarea id="textContent" placeholder="اكتب ملاحظة..."></textarea>
        <button onclick="sendText()" class="btn btn-green">حفظ النص</button>

        <hr style="border: 0.5px solid #334155; margin: 25px 0;">

        <input type="file" id="imageInput" accept="image/*">
        <button onclick="uploadImage()" class="btn btn-blue">رفع الصورة الآن</button>

        <div id="status"></div>
    </div>

    <script>
        const SUPABASE_URL = 'https://af737100-creator.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_vPxzDCtgCkG8VDy-4vkVsg_rYLQZ3yM'; 
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function sendText() {
            const content = document.getElementById('textContent').value;
            if (!content) return;
            const { error } = await supabaseClient.from('random_dumps').insert([{ content }]);
            if (!error) { document.getElementById('status').innerText = "✅ تم حفظ النص!"; document.getElementById('textContent').value = ""; }
        }

        async function uploadImage() {
            const file = document.getElementById('imageInput').files[0];
            if (!file) return alert("اختر صورة!");
            document.getElementById('status').innerText = "⏳ جاري الرفع...";
            const fileName = `${Date.now()}_${file.name}`;
            const { data, error } = await supabaseClient.storage.from('RANDOM_MEDIA').upload(fileName, file);
            if (error) { document.getElementById('status').innerText = "❌ فشل: " + error.message; }
            else { document.getElementById('status').innerText = "✅ تم الرفع بنجاح!"; }
        }
    </script>
</body>
</html>
