<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستودع رمزي أوفلاين</title>
    <style>
        body { font-family: sans-serif; background-color: #121826; color: white; text-align: center; padding: 20px; }
        .card { background: #1f2937; padding: 20px; border-radius: 15px; border: 1px solid #374151; margin-bottom: 20px; }
        textarea { width: 100%; height: 80px; border-radius: 10px; padding: 10px; background: #111827; color: white; border: 1px solid #4b5563; box-sizing: border-box; }
        .btn { width: 100%; padding: 12px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; }
        .btn-green { background: #10b981; color: white; }
        .btn-red { background: #ef4444; color: white; font-size: 0.8em; padding: 5px; width: auto; }
        #list { margin-top: 20px; text-align: right; }
        .item { background: #1f2937; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-right: 5px solid #10b981; display: flex; justify-content: space-between; align-items: center; }
        img { max-width: 100px; border-radius: 5px; }
    </style>
</head>
<body>

    <h2>مستودع رمزي (يعمل بدون إنترنت)</h2>
    
    <div class="card">
        <textarea id="noteInput" placeholder="اكتب ملاحظة للحفظ محلياً..."></textarea>
        <input type="file" id="imgInput" accept="image/*" style="margin-top:10px;">
        <button onclick="saveData()" class="btn btn-green">حفظ في ذاكرة الهاتف</button>
    </div>

    <div id="list"></div>

    <script>
        // دالة الحفظ في ذاكرة الهاتف (LocalStorage)
        function saveData() {
            const note = document.getElementById('noteInput').value;
            const file = document.getElementById('imgInput').files[0];
            const reader = new FileReader();

            if (!note && !file) return alert("أدخل بيانات أولاً");

            if (file) {
                reader.readAsDataURL(file); // تحويل الصورة لنص (Base64) لتخزينها محلياً
                reader.onload = function () {
                    const item = { note: note, img: reader.result, id: Date.now() };
                    store(item);
                };
            } else {
                const item = { note: note, img: null, id: Date.now() };
                store(item);
            }
        }

        function store(item) {
            let data = JSON.parse(localStorage.getItem('ramzi_data') || '[]');
            data.unshift(item);
            localStorage.setItem('ramzi_data', JSON.stringify(data));
            render();
            document.getElementById('noteInput').value = "";
            document.getElementById('imgInput').value = "";
        }

        function render() {
            const data = JSON.parse(localStorage.getItem('ramzi_data') || '[]');
            const listDiv = document.getElementById('list');
            listDiv.innerHTML = data.map(i => `
                <div class="item">
                    <div>
                        ${i.img ? `<img src="${i.img}"><br>` : ''}
                        <span>${i.note}</span>
                    </div>
                    <button class="btn btn-red" onclick="deleteItem(${i.id})">حذف</button>
                </div>
            `).join('');
        }

        function deleteItem(id) {
            let data = JSON.parse(localStorage.getItem('ramzi_data') || '[]');
            data = data.filter(i => i.id !== id);
            localStorage.setItem('ramzi_data', JSON.stringify(data));
            render();
        }

        // تشغيل العرض عند فتح التطبيق
        render();
    </script>
</body>
</html>
